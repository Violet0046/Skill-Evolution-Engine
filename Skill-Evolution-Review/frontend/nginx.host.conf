# frontend/nginx.host.conf
# 容器内 nginx 配置 (host-only 部署路径)
#
# 这个 conf 放进容器 /etc/nginx/conf.d/review.conf, 由 nginx.conf.host include.
#
# 反代目标解释:
#   host.docker.internal 在 docker 20.10 自动配置, 但你机器上 DNS
#   把 host.docker.internal 重定向到公司 zte.com.cn 子域 (10.41.x.x), 不是 host 主机.
#   改用 docker0 网桥 IP 172.17.0.1, 这是 host 网关, 容器能直连.

server {
    listen 5180;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 反代 /api/ 到 host 上跑的 uvicorn (走 docker0 网桥)
    location /api/ {
        proxy_pass http://172.17.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # hashed 静态资产强缓存
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # SPA fallback (虽然现在只有 '/')
    location / {
        try_files $uri $uri/ /index.html;
    }
}
