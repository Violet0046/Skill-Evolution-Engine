# frontend/nginx.conf
# 容器内 nginx 配置, 用于 serve 已 build 好的 React 静态文件 + 反代 /api 到 backend 容器
#
# 路由设计:
#   - listen 80 容器内, 由 docker run -p 把端口映射到 host
#   - /api/* -> http://backend:8000/api/*   (同 docker network, 用容器名解析)
#   - 其它路径: SPA fallback, 找不到的文件 -> index.html
#     (本项目路由只有 '/', 但保留习惯避免加路由时炸掉)
#   - 不缓存 index.html; hashed assets 走强缓存

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # —— 反代 /api/* 到 backend 容器 ——
    # 前端代码 (api.ts) 把请求发到 `<BASE>/api/runs`, BASE 在 build 时由 VITE_API_BASE_URL 决定
    # production 镜像里 VITE_API_BASE_URL=/api, 所以请求路径是 /api/xxx
    # nginx proxy_pass URL 带尾部 /, 匹配 /api/ 后接剩余部分转发
    # upstream server 写 backend:8000 (backend 是 docker compose/service name)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # —— 静态资产 (Vite build 出来的 hashed files) ——
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # —— favicon ——
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # —— SPA fallback ——
    location / {
        try_files $uri $uri/ /index.html;
    }
}
